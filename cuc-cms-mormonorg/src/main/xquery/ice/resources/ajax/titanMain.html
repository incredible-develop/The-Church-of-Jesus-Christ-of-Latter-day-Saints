<section class="ldse-section ldse-clearfix ldse-collection-page">
    <div class="ldse-section--body">
        <section id="collection-search" class="ldse-section ldse-force--border ldse-clearfix">
            <header class="ldse-section--header">
                <h2>
                    <a href="#search-items" class="ldse-icon-ko-tri-down">Search</a>
                </h2>
            </header>
            <div id="search-items" class="ldse-section--body">
                <form class="ldse-form ldse-search ldse-box ldse-tableize" id="collection-modal-form">
                    <span class="ldse-tableize--fill">
                        <input type="text" placeholder="Search Teasers" id="collection-modal-search" class="ldse-square-right search-input" />
                    </span>
                    <span>
                        <input type="button" id="collection-modal-search-button" value="" class="ldse-square-left ldse-toggle-content" />
                    </span>
                </form>
                <button class="ldse-button ldse-push-right primary leaveSearch ldse-icon-check2" id="ldse-collection-modal-done">Done</button>
                <div class="search-results" id="collection-modal-search-results"></div>
            </div>
        </section>
    </div>
</section>
