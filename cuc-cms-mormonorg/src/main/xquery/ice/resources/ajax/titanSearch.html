<section id="collection-search" class="ldse-section ldse-force--border ldse-clearfix">
    <header class="ldse-section--header">
        <h2>
            <a href="#search-items" class="ldse-icon-ko-tri-down">Search</a>
        </h2>
    </header>
    <div id="search-items" class="ldse-section--body">
        <form class="ldse-form ldse-search ldse-box ldse-tableize" id="collection-modal-form" ng-keypress=" ($event.which === 13) ? $ctrl.getResults($ctrl.search.term, 1, 1) : 0">
            <span class="ldse-tableize--fill">
                <input type="text" placeholder="Search" ng-model="$ctrl.search.term" id="collection-modal-search" class="ldse-square-right search-input" autofocus/>
            </span>
            <span>
                <input type="button" id="collection-modal-search-button" value="" class="ldse-square-left ldse-toggle-content" ng-click="$ctrl.getResults($ctrl.search.term, 1, 1);" />
            </span>
        </form>
        <div style="width:100%; height:40px;">
            <button class="ldse-button ldse-push-right primary leaveSearch ldse-icon-check2" id="ldse-collection-modal-done" ng-click="$ctrl.hide();">Done</button>
        </div>
        <titan-results results="$ctrl.results.results"></titan-results>
        <pagination pages="$ctrl.results.pages[0]" change="$ctrl.results"></pagination>
    </div>
</section>
